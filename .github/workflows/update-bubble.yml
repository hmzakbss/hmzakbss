name: Update Language Bubble Chart

on:
  schedule:
    - cron: "0 0 * * *" # Her gün gece yarısı çalışır
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests matplotlib numpy

      - name: Run Python Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generate_bubbles.py

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages_bubble.svg
          git commit -m "Auto-update language bubble chart" || exit 0
          git push
