name: Update Language Bubble Chart

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow


      - name: Generate Language Charts

        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

        run: |
          python generate_bubbles.py


      - name: Check Generated Files
        run: |
          ls -lh languages_bubble.svg
          ls -lh languages_bubble.gif


      - name: Commit and Push
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add languages_bubble.svg
          git add languages_bubble.gif

          git diff --cached --quiet && exit 0

          git commit \
            -m "chore: update language bubble chart"

          git push
