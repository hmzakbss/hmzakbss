            stop-color="#080B12"/>

        <stop
            offset="55%"
            stop-color="#0D111A"/>

        <stop
            offset="100%"
            stop-color="#111827"/>

    </linearGradient>

    <filter
        id="shadow"
        x="-60%"
        y="-60%"
        width="220%"
        height="220%">

        <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="15"
            flood-color="#000000"
            flood-opacity=".42"/>

    </filter>

    <filter
        id="softShadow"
        x="-60%"
        y="-60%"
        width="220%"
        height="220%">

        <feDropShadow
            dx="0"
            dy="7"
            stdDeviation="9"
            flood-color="#000000"
            flood-opacity=".35"/>

    </filter>

</defs>


